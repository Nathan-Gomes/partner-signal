services:
  - type: web
    name: partner-signal
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: PARTNERSIGNAL_RESEED_ON_START
        value: "true"
      # Optional: set in the Render dashboard to enable live Claude drafting.
      - key: PARTNERSIGNAL_ANTHROPIC_API_KEY
        sync: false
